<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0f172a"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="800" height="56" fill="#1e293b"/>
  <text x="24" y="36" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f1f5f9">Sales Performance Dashboard</text>
  <text x="680" y="36" font-family="sans-serif" font-size="12" fill="#64748b">2020 – 2023</text>

  <!-- KPI cards row -->
  <rect x="20" y="72" width="170" height="72" rx="8" fill="#1e293b"/>
  <text x="36" y="96" font-family="sans-serif" font-size="11" fill="#64748b">Total Revenue</text>
  <text x="36" y="124" font-family="sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">$2.3M</text>

  <rect x="205" y="72" width="170" height="72" rx="8" fill="#1e293b"/>
  <text x="221" y="96" font-family="sans-serif" font-size="11" fill="#64748b">Total Profit</text>
  <text x="221" y="124" font-family="sans-serif" font-size="22" font-weight="bold" fill="#34d399">$286K</text>

  <rect x="390" y="72" width="170" height="72" rx="8" fill="#1e293b"/>
  <text x="406" y="96" font-family="sans-serif" font-size="11" fill="#64748b">Profit Margin</text>
  <text x="406" y="124" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f59e0b">12.4%</text>

  <rect x="575" y="72" width="205" height="72" rx="8" fill="#1e293b"/>
  <text x="591" y="96" font-family="sans-serif" font-size="11" fill="#64748b">Total Orders</text>
  <text x="591" y="124" font-family="sans-serif" font-size="22" font-weight="bold" fill="#a78bfa">9,994</text>

  <!-- Revenue trend chart -->
  <rect x="20" y="160" width="470" height="170" rx="8" fill="#1e293b"/>
  <text x="36" y="184" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Monthly Revenue Trend</text>
  <!-- Fake line chart bars -->
  <polyline points="44,310 90,290 136,295 182,270 228,265 274,240 320,250 366,220 412,215 440,200" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="44,318 90,315 136,317 182,308 228,305 274,295 320,300 366,285 412,280 440,275" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" stroke-linejoin="round"/>
  <text x="44" y="336" font-family="sans-serif" font-size="9" fill="#475569">Jan</text>
  <text x="136" y="336" font-family="sans-serif" font-size="9" fill="#475569">Mar</text>
  <text x="228" y="336" font-family="sans-serif" font-size="9" fill="#475569">May</text>
  <text x="320" y="336" font-family="sans-serif" font-size="9" fill="#475569">Jul</text>
  <text x="412" y="336" font-family="sans-serif" font-size="9" fill="#475569">Sep</text>

  <!-- Category bar chart -->
  <rect x="505" y="160" width="275" height="170" rx="8" fill="#1e293b"/>
  <text x="521" y="184" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Revenue by Category</text>
  <rect x="521" y="200" width="140" height="24" rx="3" fill="#38bdf8"/>
  <text x="669" y="217" font-family="sans-serif" font-size="10" fill="#94a3b8">Technology</text>
  <rect x="521" y="232" width="100" height="24" rx="3" fill="#38bdf8" opacity="0.7"/>
  <text x="629" y="249" font-family="sans-serif" font-size="10" fill="#94a3b8">Furniture</text>
  <rect x="521" y="264" width="120" height="24" rx="3" fill="#38bdf8" opacity="0.5"/>
  <text x="649" y="281" font-family="sans-serif" font-size="10" fill="#94a3b8">Office Supplies</text>

  <!-- Bottom row: map placeholder + table -->
  <rect x="20" y="346" width="370" height="90" rx="8" fill="#1e293b"/>
  <text x="36" y="368" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Sales by Region</text>
  <text x="205" y="400" font-family="sans-serif" font-size="13" fill="#334155" text-anchor="middle">[ Map Visualization ]</text>

  <rect x="405" y="346" width="375" height="90" rx="8" fill="#1e293b"/>
  <text x="421" y="368" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Top Sub-Categories</text>
  <text x="421" y="390" font-family="sans-serif" font-size="10" fill="#94a3b8">Phones</text>
  <text x="700" y="390" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="end">$330K</text>
  <text x="421" y="408" font-family="sans-serif" font-size="10" fill="#94a3b8">Chairs</text>
  <text x="700" y="408" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="end">$328K</text>
  <text x="421" y="426" font-family="sans-serif" font-size="10" fill="#94a3b8">Storage</text>
  <text x="700" y="426" font-family="sans-serif" font-size="10" fill="#34d399" text-anchor="end">$223K</text>

  <!-- Watermark -->
  <text x="400" y="446" font-family="sans-serif" font-size="9" fill="#1e293b" text-anchor="middle">Replace with actual dashboard screenshot</text>
</svg>
